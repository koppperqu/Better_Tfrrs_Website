<!DOCTYPE html>
<html th:replace="~{base :: base(~{::content})}" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="text-center">
        <div class="custom-background rounded-top">
            <h3 class="col-12 display-3 p-2 pb-0 mb-0" th:text="${teamName}"></h3>
            <h3 class="col-12 display-5 p-2 pt-0">PR's by Events</h3>
        </div>
        <div class="row justify-content-center">
            <div class="col-4 col-md-2 p-1 m-1" th:each = "eventName, eachStatus : ${eventsDTO.eventNames}">
                <a class = "btn custom-btn w-100 h-100" th:href="${eventsDTO.eventURLs[eachStatus.index]}" th:text = "${eventName}"></a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
